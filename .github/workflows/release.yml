name: Test and build experimental kext
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FAT image test utilities
        run: sudo apt-get update && sudo apt-get install -y mtools
      - run: python3 -B -m unittest discover -s tests -v
      - name: Validate address arithmetic
        run: |
          for source in tests/test_gart_addresses.cpp tests/test_kiq_addresses.cpp; do
            g++ -std=c++14 -Wall -Wextra -Werror -fsanitize=undefined "$source" -o /tmp/address-test
            /tmp/address-test
          done
      - name: Validate concurrent diagnostic records
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/test_diagnostic_records.cpp -o /tmp/record-test
          /tmp/record-test
  build:
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain/liludbg"
          SDK_COMMIT=$(python3 -c 'import json; print(json.load(open("build-support/inputs.json"))["mac_kernel_sdk_commit"])')
          LILU_VERSION=$(python3 -c 'import json; print(json.load(open("build-support/inputs.json"))["lilu_version"])')
          curl --fail --location --retry 3 "https://github.com/acidanthera/MacKernelSDK/archive/${SDK_COMMIT}.tar.gz" -o "$RUNNER_TEMP/sdk.tar.gz"
          tar xzf "$RUNNER_TEMP/sdk.tar.gz" -C "$RUNNER_TEMP/toolchain"
          mv "$RUNNER_TEMP/toolchain/MacKernelSDK-${SDK_COMMIT}" "$RUNNER_TEMP/toolchain/MacKernelSDK-master"
          curl --fail --location --retry 3 "https://github.com/acidanthera/Lilu/releases/download/${LILU_VERSION}/Lilu-${LILU_VERSION}-DEBUG.zip" -o "$RUNNER_TEMP/lilu.zip"
          LILU_SHA=$(python3 -c 'import json; print(json.load(open("build-support/inputs.json"))["lilu_archive_sha256"])')
          echo "$LILU_SHA  $RUNNER_TEMP/lilu.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/lilu.zip" -d "$RUNNER_TEMP/toolchain/liludbg"
      - name: Compile release from source
        shell: bash
        run: |
          export KEXT_LD="$(xcrun --find ld)"
          python3 -B tools/build-release.py --toolchain "$RUNNER_TEMP/toolchain" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-kext
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-kext
          path: dist
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "RaphaelGPU $RELEASE_TAG (experimental)" --notes-file docs/release-notes.md
