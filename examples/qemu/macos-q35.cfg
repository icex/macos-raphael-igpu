# General macOS VM example, based on the project's tested Q35/AHCI/vmxnet3 topology.
# Copy to a private VM directory; edit paths, resources and your AppleSMC key.
# This file does not attach a physical GPU. See README.md for the optional overlay.
# Requires a matching OVMF CODE/VARS pair and an AMD-compatible OpenCore installation.
[machine]
  type = "q35"
  accel = "kvm"
[memory]
  size = "8G"
[smp-opts]
  cpus = "8"
  sockets = "1"
  cores = "8"
  threads = "1"
[rtc]
  base = "localtime"
  clock = "host"
  driftfix = "slew"
[drive "firmware-code"]
  if = "pflash"
  format = "raw"
  readonly = "on"
  file = "OVMF_CODE.fd"
[drive "firmware-vars"]
  if = "pflash"
  format = "raw"
  file = "OVMF_VARS.fd"
[device "smc"]
  driver = "isa-applesmc"
  osk = "REPLACE_WITH_YOUR_OWN_APPLE_SMC_KEY"
[device "sata"]
  driver = "ich9-ahci"
  bus = "pcie.0"
  addr = "0x4"
[drive "OpenCore"]
  if = "none"
  format = "qcow2"
  file = "OpenCore.qcow2"
[device "opencore-disk"]
  driver = "ide-hd"
  bus = "sata.2"
  drive = "OpenCore"
  bootindex = "1"
[drive "MacHDD"]
  if = "none"
  format = "qcow2"
  file = "macos.qcow2"
[device "macos-disk"]
  driver = "ide-hd"
  bus = "sata.4"
  drive = "MacHDD"
[device "usb"]
  driver = "qemu-xhci"
  bus = "pcie.0"
  addr = "0x5"
[device "keyboard"]
  driver = "usb-kbd"
  bus = "usb.0"
[device "tablet"]
  driver = "usb-tablet"
  bus = "usb.0"
[netdev "network"]
  type = "user"
  hostfwd = "tcp:127.0.0.1:50922-:22"
  hostfwd = "tcp:127.0.0.1:5900-:5900"
[device "nic"]
  driver = "vmxnet3"
  netdev = "network"
  bus = "pcie.0"
  addr = "0x3"
  mac = "02:00:00:12:34:56"
[chardev "serial-log"]
  backend = "file"
  path = "serial.log"
[device "serial"]
  driver = "isa-serial"
  chardev = "serial-log"
[chardev "monitor"]
  backend = "socket"
  path = "monitor.sock"
  server = "on"
  wait = "off"
[mon "monitor"]
  chardev = "monitor"
  mode = "control"
