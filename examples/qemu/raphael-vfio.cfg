# OPTIONAL overlay: only for an already prepared, identified Raphael GPU.
# Keep it directly on pcie.0 at 0x6 to match OpenCore DeviceProperties.
# Replace the BDF placeholder; no binding/reset commands are performed here.
# Use -vga none -display none, not an emulated VGA alongside the accelerator.
# Requires the host-safety / supervision / cleanup procedure in the guide.
[device "raphael"]
  driver = "vfio-pci"
  host = "REPLACE_WITH_GPU_BDF"
  bus = "pcie.0"
  addr = "0x6"
  x-pci-vendor-id = "0x1002"
  x-pci-device-id = "0x73ff"
  romfile = "gpu-patched.rom"
